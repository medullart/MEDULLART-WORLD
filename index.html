<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medullart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            position: relative;
            /* Garantiza que la flechita del cursor se vea en toda la pantalla */
            cursor: default !important;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .logo, nav a {
            pointer-events: auto;
            cursor: pointer !important;
        }

        .logo {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            margin-left: 30px;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 1;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Asegura que el canvas interactivo respete la flecha del sistema */
            cursor: default !important;
        }

        .audio-panel {
            position: fixed;
            bottom: 50px;
            left: 50px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.6);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #1a1a1a;
            backdrop-filter: blur(10px);
        }

        .audio-panel p {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .upload-btn {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #ffffff;
            background: transparent;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        input[type="file"] {
            display: none;
        }

        .info-panel {
            position: fixed;
            bottom: 50px;
            right: 50px;
            z-index: 10;
            max-width: 300px;
            text-align: right;
            pointer-events: none;
        }

        .info-panel h1 {
            font-size: 32px;
            font-weight: 200;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }

        .info-panel p {
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Medullart</div>
        <nav>
            <a href="#works">Works</a>
            <a href="#concept">Concept</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div id="canvas-container"></div>

    <div class="audio-panel">
        <p>Sistemas Nerviosos Colectivos</p>
        <label class="upload-btn">
            Upload Audio
            <input type="file" id="audio-input" accept="audio/*">
        </label>
    </div>

    <div class="info-panel">
        <h1>MEDULLART</h1>
        <p>Materialización de entidades virtuales y cápsulas emocionales a través de la síntesis digital rítmica.</p>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Renderizador con soporte de luces y reflejos mejorados para látex
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        camera.position.z = 5;

        // ILUMINACIÓN REALISTA PARA TEXTURA PLÁSTICA / LÁTEX
        const ambientLight = new THREE.AmbientLight(0x111111, 0.5);
        scene.add(ambientLight);

        // Luz de estudio frontal difusa
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // Luz de contra (Rim Light) para destacar los bordes del látex
        const rimLight = new THREE.DirectionalLight(0xffffff, 2.0);
        rimLight.position.set(-5, 3, -3);
        scene.add(rimLight);

        // Luz de punto que persigue sutilmente los reflejos
        const pointLight = new THREE.PointLight(0xffffff, 1.0, 15);
        pointLight.position.set(0, 0, 3);
        scene.add(pointLight);

        // Construcción de la geometría del filamento vertical
        const points = [];
        const segmentCount = 300; // Más resolución para deformaciones fluidas
        for (let i = 0; i < segmentCount; i++) {
            points.push(new THREE.Vector3(0, (i / segmentCount) * 4.4 - 2.2, 0));
        }

        const curve = new THREE.CatmullRomCurve3(points);
        // Creamos un tubo grueso desde el inicio para apreciar la textura plástica reflectante
        const tubeGeometry = new THREE.TubeGeometry(curve, 200, 0.04, 24, false);
        const originalTubePositions = tubeGeometry.attributes.position.clone();

        // TEXTURA DE LÁTEX PLÁSTICO BRILLANTE (MeshPhysicalMaterial)
        const latexMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xeeeeee,            // Tono base claro que reacciona de forma espectacular a las luces
            roughness: 0.08,            // Muy baja rugosidad para simular acabado liso y pulido
            metalness: 0.05,            // Toque mínimo metálico para densificar el material plástico
            clearcoat: 1.0,             // Capa de barniz brillante externa (efecto látex líquido/plástico mojado)
            clearcoatRoughness: 0.03,   // Reflejo exterior nítido de la luz de estudio
            reflectivity: 0.9,          // Alta capacidad de rebote de luz ambiental
            flatShading: false
        });

        const filament = new THREE.Mesh(tubeGeometry, latexMaterial);
        scene.add(filament);

        // Configuración de movimiento del cursor
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        let audioContext, analyser, dataArray;
        let isAudioPlaying = false;

        function updateCoordinates(clientX, clientY) {
            // Conversión matemática a espacio 3D normalizado
            mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;
        }

        window.addEventListener('mousemove', (e) => updateCoordinates(e.clientX, e.clientY));
        
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Procesamiento rítmico de audio cargado
        const audioInput = document.getElementById('audio-input');
        audioInput.addEventListener('change', function() {
            const files = this.files;
            if (files.length === 0) return;

            const audio = new Audio();
            audio.src = URL.createObjectURL(files[0]);
            audio.load();
            audio.play();

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const src = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();
            src.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 128;

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            isAudioPlaying = true;
        });

        const clock = new THREE.Clock();

        // Ciclo de animación en tiempo real
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Interpolación suavizada del movimiento del cursor
            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            let audioIntensity = 0;
            if (isAudioPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                audioIntensity = sum / dataArray.length / 255;
            }

            const positionAttribute = tubeGeometry.attributes.position;
            
            for (let i = 0; i < positionAttribute.count; i++) {
                let x = originalTubePositions.getX(i);
                let y = originalTubePositions.getY(i);
                let z = originalTubePositions.getZ(i);

                // Distancia entre el vértice actual de la malla plástica y el cursor del usuario
                const dist = Math.sqrt(Math.pow(x - mouse.x * 2.5, 2) + Math.pow(y - mouse.y * 2.5, 2));

                // INFLUENCIA DINÁMICA DEL CURSOR (Se incrementó la distancia de acción a 2.5 y el factor de onda a 0.35)
                if (dist < 2.5) {
                    const wave = Math.sin(y * 3.5 + elapsedTime * 6) * 0.35 * (2.5 - dist);
                    x += wave;
                    z += Math.cos(y * 3.5 + elapsedTime * 6) * 0.15 * (2.5 - dist);
                }

                // Modificaciones plásticas en base a las frecuencias rítmicas del audio
                if (audioIntensity > 0) {
                    const noise = Math.sin(y * 8 + elapsedTime * 18) * audioIntensity * 0.4;
                    x += noise;
                    z += Math.cos(y * 8 + elapsedTime * 18) * audioIntensity * 0.4;
                    
                    // Modulación sutil de color bajo el látex según la potencia rítmica
                    filament.material.color.setHSL(0.55 + audioIntensity * 0.3, 0.2, 0.4 + audioIntensity * 0.3);
                } else {
                    filament.material.color.setRGB(0.95, 0.95, 0.95);
                }

                positionAttribute.setXYZ(i, x, y, z);
            }
            
            positionAttribute.needsUpdate = true;
            
            // Rotación constante del eje para actualizar los brillos especulares del látex plano
            filament.rotation.y = elapsedTime * 0.03;

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste dinámico de pantalla completa
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
