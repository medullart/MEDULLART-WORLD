<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDULLART</title>
    <!-- Cargamos las dos librerías necesarias para el renderizado avanzado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020204;
            font-family: sans-serif;
            color: #fff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .header {
            font-size: 12px;
            letter-spacing: 2px;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }
        .btn {
            background: transparent;
            border: 1px solid #ffffff33;
            color: #fff;
            padding: 8px 16px;
            font-size: 10px;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="interface">
        <div class="header">MEDULLART</div>
        
        <div class="footer">
            <button class="btn">UPLOAD AUDIO</button>
            <div style="font-size: 10px; text-align: right; opacity: 0.5;">
                SYSTEM: XTNT_REALITY<br>
                STATUS: ACTIVE
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020204, 0.04);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Inicializar el soporte para reflejos realistas de luces en materiales curvos
        RectAreaLightUniformsLib.init();

        // --- LUCES DE ESTUDIO TIPO CINEMA 4D ---
        scene.add(new THREE.AmbientLight(0x0a0a12));
        
        const lightMain = new THREE.PointLight(0xffffff, 5, 40);
        lightMain.position.set(10, 10, 10);
        scene.add(lightMain);

        const lightNeonCyan = new THREE.DirectionalLight(0x00f0ff, 4.0);
        lightNeonCyan.position.set(-10, 4, -2);
        scene.add(lightNeonCyan);

        const lightNeonPink = new THREE.DirectionalLight(0xff00bb, 3.0);
        lightNeonPink.position.set(10, -4, -2);
        scene.add(lightNeonPink);

        // --- ENTORNO REFLECTIVO ARTIFICIAL ---
        // Al no tener una imagen HDRI de fondo, creamos un cubo invisible de luz para generar reflejos en el plástico
        const reflectionGeometry = new THREE.BoxGeometry(30, 30, 30);
        const reflectionMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide, wireframe: true, opacity: 0.05, transparent: true });
        const reflectionCube = new THREE.Mesh(reflectionGeometry, reflectionMaterial);
        scene.add(reflectionCube);

        // --- GEOMETRÍA ABSTRACTA DE PLÁSTICO DANEL ---
        const meshGroup = new THREE.Group();
        
        const matPlasticDanel = new THREE.MeshStandardMaterial({ 
            color: 0x06060c, 
            roughness: 0.05,     // Acabado pulido espejo
            metalness: 0.1,      // Plástico puro no metálico
            clearcoat: 1.0,      // Capa de laca brillante superior
            clearcoatRoughness: 0.01
        });

        // Nudo Toroidal denso para forzar reflejos abstractos complejos
        const baseGeo = new THREE.TorusKnotGeometry(3.5, 1.1, 160, 16, 3, 5);
        const posBackup = baseGeo.attributes.position.clone();
        
        const abstractMesh = new THREE.Mesh(baseGeo, matPlasticDanel);
        meshGroup.add(abstractMesh);
        scene.add(meshGroup);

        // --- FILAMENTOS ENREDADOS ---
        const cablesCount = 45;
        const cablesData = [];
        const cablesGroup = new THREE.Group();
        const matCable = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.8 });

        for (let i = 0; i < cablesCount; i++) {
            const pointsCount = 70;
            const points = Array.from({length: pointsCount}, () => new THREE.Vector3());
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geo, matCable.clone());
            
            if(Math.random() > 0.5) line.material.color.setHex(0xff00bb);
            
            cablesGroup.add(line);
            cablesData.push({
                line: line, pointsCount: pointsCount,
                speed: 0.5 + Math.random() * 0.7,
                theta: Math.random() * Math.PI * 2,
                phi: Math.acos((Math.random() * 2) - 1),
                seed: Math.random() * 100
            });
        }
        scene.add(cablesGroup);

        // --- AUDIO ---
        let analyser, dataArray, audioVol = 0;
        const btn = document.querySelector('.btn');
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'audio/*';
        btn.addEventListener('click', () => input.click());
        input.addEventListener('change', function() {
            if (!this.files[0]) return;
            const audio = new Audio(URL.createObjectURL(this.files[0]));
            audio.loop = true; audio.play();
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaElementSource(audio);
            analyser = ctx.createAnalyser();
            src.connect(analyser); analyser.connect(ctx.destination);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            btn.innerText = "DANEL RENDERING";
        });

        // --- MOUSE ---
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - window.innerWidth / 2) * 0.0015;
            targetY = (e.clientY - window.innerHeight / 2) * 0.0015;
        });

        // --- ANIMACIÓN ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = dataArray.reduce((a, b) => a + b, 0);
                audioVol = (sum / dataArray.length) * 0.25;
            }

            mouseX += (targetX - mouseX) * 0.05;
            mouseY += (targetY - mouseY) * 0.05;
            meshGroup.rotation.y = cablesGroup.rotation.y = mouseX + time * 0.08;
            meshGroup.rotation.x = cablesGroup.rotation.x = mouseY;

            // Deformación geométrica interactiva
            const pos = abstractMesh.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = posBackup.getX(i);
                let y = posBackup.getY(i);
                let z = posBackup.getZ(i);

                let wave = Math.sin(x * 0.4 + time * 2.5) * (0.2 + audioVol);
                pos.setXYZ(i, x + wave, y + wave, z + wave);
            }
            pos.needsUpdate = true;
            abstractMesh.geometry.computeVertexNormals();

            // Animación de los cables
            cablesData.forEach((c) => {
                const cPos = c.line.geometry.attributes.position;
                for (let i = 0; i < c.pointsCount; i++) {
                    const ratio = i / c.pointsCount;
                    const offset = Math.sin(ratio * 8 + time * c.speed + c.seed) * (0.4 + audioVol);
                    const r = 4.2 + offset;
                    
                    const x = r * Math.sin(c.phi) * Math.cos(c.theta + (ratio * 4));
                    const y = (ratio - 0.5) * 10 + Math.sin(time + c.seed) * 0.3;
                    const z = r * Math.cos(c.phi);
                    cPos.setXYZ(i, x, y, z);
                }
                cPos.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
